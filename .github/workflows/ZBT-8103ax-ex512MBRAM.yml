name: Build MT7981 FIP Matrix for ZBT-8103ax-ex512MBRAM

on:
  push:
  workflow_dispatch:

jobs:
  build-matrix:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ddr: [DDR3, DDR4]
        bga: [BGA]
        flash: [64MB,128MB]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu device-tree-compiler bc bison flex libssl-dev make

      - name: Set environment variables
        run: |
          if [ "${{ matrix.ddr }}" == "DDR3" ]; then
            echo "DRAM_USE_DDR3=1" >> $GITHUB_ENV
            echo "DRAM_USE_DDR4=0" >> $GITHUB_ENV
          else
            echo "DRAM_USE_DDR3=0" >> $GITHUB_ENV
            echo "DRAM_USE_DDR4=1" >> $GITHUB_ENV
          fi
          echo "BOARD_BGA=1" >> $GITHUB_ENV

          # Flash size 64/128
          if [ "${{ matrix.flash }}" == "64MB" ]; then
            echo "FLASH_UBI_SIZE=0x3a80000" >> $GITHUB_ENV
          else
            echo "FLASH_UBI_SIZE=0x7a80000" >> $GITHUB_ENV
          fi

      - name: Build U-Boot
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          make mt7981_rfb_defconfig
          sed -i 's/CONFIG_NR_DRAM_BANKS=1/CONFIG_NR_DRAM_BANKS=2/g' .config
          make -j$(nproc)

          # find BL33
          BL33=$(ls u-boot*.bin u-boot*.itb 2>/dev/null | head -n1)
          echo "BL33=${BL33}" >> $GITHUB_ENV

      - name: Build ATF and FIP
        run: |
          git clone https://github.com/mtk-openwrt/arm-trusted-firmware --depth 1
          cd arm-trusted-firmware
          export DRAM_USE_DDR3=${DRAM_USE_DDR3}
          export DRAM_USE_DDR4=${DRAM_USE_DDR4}
          export BOARD_BGA=${BOARD_BGA}
          make PLAT=mt7981 BOOT_DEVICE=spim-nand \
            BL33=../${BL33} \
            BOARD_BGA=${BOARD_BGA} \
            all fip

          cp build/mt7981/release/fip.bin ../fip-mt7981-z8103ax-${{ matrix.ddr }}-${{ matrix.bga }}-${{ matrix.flash }}.fip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FIP-${{ matrix.ddr }}-${{ matrix.bga }}-${{ matrix.flash }}
          path: fip-mt7981-${{ matrix.ddr }}-${{ matrix.bga }}-${{ matrix.flash }}.fip
